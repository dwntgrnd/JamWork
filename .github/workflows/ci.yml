name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Validate composer files
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run notification decision tests
        run: php tests/NotificationServiceTest.php

      - name: Run security hardening tests
        run: php tests/SecurityHardeningTest.php

      - name: Security audit (fails on known advisories)
        run: composer audit

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking until backlog cleared — see docs/audits/2026-06-01-code-audit.md §6)
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Security audit (high severity)
        run: npm audit --audit-level=high
